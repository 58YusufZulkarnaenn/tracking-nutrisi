<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tracker Makan</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0e1116;--card:#171d26;--card2:#1f2733;--line:#2b3543;
  --text:#e6edf3;--muted:#8b98a8;--accent:#3ddc97;--blue:#4aa8ff;
  --warn:#ffb454;--danger:#ff6b6b;
}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
input,button,select{font:inherit;color:inherit}

/* ===== APP LAYOUT ===== */
.app{
  display:flex;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  position:relative;
}

/* ===== SIDEBAR ===== */
.sidebar{
  position:fixed;
  top:0;left:0;bottom:0;
  width:270px;
  background:#141a22;
  border-right:1px solid var(--line);
  z-index:100;
  transform:translateX(-100%);
  transition:transform .25s ease;
  display:flex;
  flex-direction:column;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:4px 0 30px rgba(0,0,0,.5);
}
.sidebar.open{transform:translateX(0)}
.sidebar-head{
  display:flex;
  align-items:center;
  gap:10px;
  padding:18px 18px 16px;
  border-bottom:1px solid var(--line);
  flex-shrink:0;
}
.sidebar-head .logo{font-size:26px}
.sidebar-head h1{font-size:17px;font-weight:700}
.sidebar-head .sub{font-size:11px;color:var(--muted);margin-top:2px}

.sidebar-nav{
  flex:1 1 auto;
  overflow-y:auto;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:4px;
}
.sidebar-nav button{
  display:flex;
  align-items:center;
  gap:14px;
  background:transparent;
  border:none;
  color:var(--muted);
  padding:13px 16px;
  border-radius:11px;
  font-size:14.5px;
  font-weight:600;
  cursor:pointer;
  text-align:left;
  transition:.15s;
  font-family:inherit;
}
.sidebar-nav button:hover{background:var(--card2);color:var(--text)}
.sidebar-nav button.active{background:rgba(61,220,151,.12);color:var(--accent)}
.sidebar-nav button .ic{font-size:20px;width:24px;text-align:center;flex-shrink:0}
.sidebar-nav button .lbl{flex:1}

.sidebar-foot{
  flex-shrink:0;
  padding:14px 18px;
  border-top:1px solid var(--line);
  font-size:11.5px;
  color:var(--muted);
  display:flex;
  align-items:center;
  gap:8px;
}
#sync-status{
  font-weight:700;
  font-size:11px;
  padding:3px 10px;
  border-radius:99px;
  background:var(--card2);
  transition:.2s;
}
#sync-status.ok{color:var(--accent);background:rgba(61,220,151,.12)}
#sync-status.syncing{color:var(--warn);background:rgba(255,180,84,.12)}
#sync-status.error{color:var(--danger);background:rgba(255,107,107,.12)}

.sidebar-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.55);
  opacity:0;pointer-events:none;
  transition:opacity .25s;
  z-index:99;
  backdrop-filter:blur(2px);
}
.sidebar-overlay.open{opacity:1;pointer-events:auto}

/* ===== CONTENT ===== */
.app-content{
  flex:1 1 auto;
  display:flex;
  flex-direction:column;
  min-width:0;
  height:100%;
  overflow:hidden;
}

.topbar{
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 12px;
  padding-top:calc(10px + env(safe-area-inset-top));
  background:rgba(14,17,22,.98);
  border-bottom:1px solid var(--line);
  z-index:40;
}
.menu-btn{
  background:var(--card2);
  border:1px solid var(--line);
  color:var(--text);
  width:42px;height:42px;
  border-radius:11px;
  cursor:pointer;
  font-size:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  transition:.15s;
  text-decoration:none;
}
.menu-btn:hover{background:#2a3441;border-color:var(--accent);color:var(--accent)}
.date-nav{display:flex;gap:6px;align-items:center;flex:1;min-width:0}
.date-nav button{
  background:var(--card2);
  border:1px solid var(--line);
  color:var(--text);
  width:38px;height:38px;
  border-radius:10px;
  cursor:pointer;
  font-size:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  transition:.15s;
}
.date-nav button:hover{border-color:var(--accent);color:var(--accent)}
.date-nav input[type=date]{
  flex:1;min-width:0;
  background:var(--card2);
  border:1px solid var(--line);
  color:var(--text);
  padding:9px 10px;
  border-radius:10px;
  font-size:13.5px;
  text-align:center;
  font-family:inherit;
}

main{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding:14px;
  padding-bottom:calc(14px + env(safe-area-inset-bottom) + 40px);
}
.view{display:none}
.view.active{display:block;max-width:640px;margin:0 auto}

/* ===== HERO ===== */
.hero{
  background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:18px;margin-bottom:16px;transition:.2s;
}
.hero.warn{border-color:rgba(255,180,84,.4)}
.hero.over{border-color:rgba(255,107,107,.5)}
.hero-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.hero-angka{display:flex;align-items:baseline;gap:6px;margin:6px 0 14px}
.hero-angka span{font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.hero.ok .hero-angka span{color:var(--accent)}
.hero.warn .hero-angka span{color:var(--warn)}
.hero.over .hero-angka span{color:var(--danger)}
.hero-angka small{font-size:14px;color:var(--muted);font-weight:600}
.hero-bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-bottom:14px}
.hero-bar>div{height:100%;border-radius:99px;transition:width .3s}
.hero-stat{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.hero-stat>div{display:flex;flex-direction:column}
.hero-stat small{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin-bottom:2px}
.hero-stat b{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}

.section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:10px}
.muted{color:var(--muted);font-size:13px}
.mb{margin-bottom:12px}

/* ===== LOG LIST ===== */
.log-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.log-item{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:12px;display:flex;gap:10px;align-items:center;
}
.li-info{flex:1;min-width:0}
.li-nama{font-weight:600;font-size:14.5px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-makro{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.li-makro b{color:var(--accent)}
.li-gram-wrap{display:flex;align-items:center;gap:3px;flex-shrink:0}
.li-gram{width:64px;background:var(--card2);border:1px solid var(--line);color:var(--text);padding:6px 8px;border-radius:8px;text-align:right;font-size:13px;font-variant-numeric:tabular-nums;font-family:inherit}
.li-gram-wrap small{font-size:11px;color:var(--muted)}
.li-gram-empty{font-size:11px;color:var(--muted);font-style:italic}
.li-del{
  background:transparent;border:none;color:var(--muted);cursor:pointer;
  width:30px;height:30px;border-radius:8px;font-size:14px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.li-del:hover{background:rgba(255,107,107,.15);color:var(--danger)}

/* ===== BUTTONS ===== */
.btn-add{
  width:100%;background:var(--accent);color:#08130d;border:none;
  padding:14px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;
  font-family:inherit;
}
.btn-add:active{transform:scale(.98)}
.btn-primary{
  background:var(--accent);color:#08130d;border:none;
  padding:12px 18px;border-radius:10px;font-weight:700;cursor:pointer;
  font-family:inherit;
}
.btn-primary.btn-block{width:100%;padding:14px}
.btn-ghost{
  background:var(--card2);color:var(--text);border:1px solid var(--line);
  padding:12px 18px;border-radius:10px;font-weight:600;cursor:pointer;
  width:100%;margin-bottom:8px;text-align:left;font-family:inherit;
}
.btn-danger{
  background:transparent;color:var(--danger);border:1px solid rgba(255,107,107,.4);
  padding:12px 18px;border-radius:10px;font-weight:600;cursor:pointer;
  width:100%;text-align:left;font-family:inherit;
}

.empty{
  text-align:center;padding:30px 16px;color:var(--muted);
  font-size:13.5px;background:var(--card);border:1px dashed var(--line);
  border-radius:12px;
}

/* ===== RIWAYAT ===== */
.riwayat-list{display:flex;flex-direction:column;gap:8px}
.riwayat-item{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;display:flex;justify-content:space-between;align-items:center;
  gap:10px;text-align:left;cursor:pointer;width:100%;font-family:inherit;color:var(--text);
}
.riwayat-item:hover{border-color:var(--accent)}
.ri-nama{font-weight:600;font-size:14px;margin-bottom:2px}
.ri-sub{font-size:11.5px;color:var(--muted)}
.ri-sisa{text-align:right;flex-shrink:0}
.ri-sisa b{display:block;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.ri-sisa small{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.ri-sisa.ok b{color:var(--accent)}
.ri-sisa.warn b{color:var(--warn)}
.ri-sisa.over b{color:var(--danger)}

/* ===== BAHAN ===== */
.bahan-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.bahan-item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.bahan-nama{
  width:100%;background:transparent;border:none;color:var(--text);
  font-size:14.5px;font-weight:600;padding:4px 0;margin-bottom:6px;
  border-bottom:1px solid transparent;font-family:inherit;
}
.bahan-nama:focus{outline:none;border-bottom-color:var(--accent)}
.bahan-makro{display:grid;grid-template-columns:repeat(4,1fr) 32px;gap:6px;align-items:end}
.bahan-makro label{display:flex;flex-direction:column;gap:2px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.bahan-makro input{
  background:var(--card2);border:1px solid var(--line);color:var(--text);
  padding:6px 8px;border-radius:7px;font-size:13px;text-align:right;
  font-variant-numeric:tabular-nums;width:100%;font-family:inherit;
}
.bahan-makro input:focus{outline:none;border-color:var(--accent)}
.bahan-del{
  background:transparent;border:none;color:var(--muted);
  width:32px;height:32px;border-radius:8px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.bahan-del:hover{background:rgba(255,107,107,.15);color:var(--danger)}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.target-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.target-row input{
  flex:1;background:var(--card2);border:1px solid var(--line);
  color:var(--text);padding:12px 14px;border-radius:10px;
  font-size:22px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;
  font-family:inherit;
}
.target-row span{font-size:14px;color:var(--muted);font-weight:600}

/* ===== SHEET ===== */
.sheet-backdrop{
  position:fixed;inset:0;
  background:rgba(0,0,0,.75);
  opacity:0;pointer-events:none;visibility:hidden;
  transition:opacity .2s,visibility 0s .2s;
  z-index:9999;
  display:flex;align-items:stretch;justify-content:center;
}
.sheet-backdrop.open{opacity:1;pointer-events:auto;visibility:visible;transition:opacity .2s,visibility 0s 0s}
.sheet{
  background:var(--bg);
  width:100%;max-width:600px;
  height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  transform:translateY(30px);transition:transform .25s;
  overflow:hidden;
}
.sheet-backdrop.open .sheet{transform:translateY(0)}
.sheet-handle{width:40px;height:4px;background:var(--line);border-radius:99px;margin:8px auto 0;flex-shrink:0}
.sheet-head{
  display:flex;align-items:center;gap:8px;padding:10px 14px;
  padding-top:calc(10px + env(safe-area-inset-top));
  border-bottom:1px solid var(--line);flex-shrink:0;
}
.sheet-tabs{display:flex;gap:4px;flex:1}
.sheet-tabs button{
  background:transparent;border:none;color:var(--muted);
  padding:8px 14px;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;
  font-family:inherit;
}
.sheet-tabs button.active{background:var(--card2);color:var(--accent)}
.sheet-close{background:var(--card2);border:none;color:var(--muted);width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:14px;flex-shrink:0}
.sheet-body{
  padding:14px;
  padding-bottom:calc(14px + env(safe-area-inset-bottom) + 60px);
  overflow-y:auto;
  overflow-x:hidden;
  flex:1 1 auto;
  min-height:0;
  touch-action:pan-y;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}

.search-input{
  width:100%;background:var(--card2);border:1px solid var(--line);
  color:var(--text);padding:12px 14px;border-radius:10px;
  font-size:14.5px;margin-bottom:12px;font-family:inherit;
}
.search-input:focus{outline:none;border-color:var(--accent)}

.pick-list{display:flex;flex-direction:column;gap:6px}
.pick-item{
  background:var(--card);border:1px solid var(--line);color:var(--text);
  padding:12px 14px;border-radius:11px;text-align:left;cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  font-family:inherit;
}
.pick-item:hover{border-color:var(--accent)}
.pi-nama{font-size:14px;font-weight:600;flex:1}
.pi-info{font-size:11.5px;color:var(--muted);white-space:nowrap}

.form{display:flex;flex-direction:column;gap:6px}
.form label{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-top:8px}
.form input{
  background:var(--card2);border:1px solid var(--line);color:var(--text);
  padding:11px 13px;border-radius:10px;font-size:14.5px;width:100%;font-family:inherit;
}
.form input:focus{outline:none;border-color:var(--accent)}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.form .btn-primary{margin-top:16px}

#toast{
  position:fixed;bottom:90px;left:50%;transform:translate(-50%,30px);
  background:var(--accent);color:#08130d;
  padding:11px 20px;border-radius:99px;font-weight:700;font-size:13.5px;
  opacity:0;pointer-events:none;transition:.25s;z-index:99999;
  box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:90vw;text-align:center;
}
#toast.show{transform:translate(-50%,0);opacity:1}
</style>
</head>
<body>

<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <span class="logo">🍽️</span>
      <div>
        <h1>Tracker Makan</h1>
        <div class="sub">Asupan harian & target kalori</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <button data-view="hari" class="active">
        <span class="ic">📅</span><span class="lbl">Hari Ini</span>
      </button>
      <button data-view="riwayat">
        <span class="ic">📊</span><span class="lbl">Riwayat</span>
      </button>
      <button data-view="bahan">
        <span class="ic">🥗</span><span class="lbl">Basis Bahan</span>
      </button>
      <button data-view="setting">
        <span class="ic">⚙️</span><span class="lbl">Setting</span>
      </button>
    </nav>

    <div class="sidebar-foot">
      <span id="sync-status">memuat...</span>
      <span style="margin-left:auto">v2.0</span>
    </div>
  </aside>

  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="app-content">
    <header class="topbar">
      <a href="/" class="menu-btn" title="Home">🏠</a>
      <button class="menu-btn" id="menu-btn" title="Menu">☰</button>
      <div class="date-nav">
        <button id="prev-day">‹</button>
        <input type="date" id="date-picker">
        <button id="next-day">›</button>
      </div>
    </header>

    <main id="main-scroll">
      <section id="view-hari" class="view active"></section>
      <section id="view-riwayat" class="view"></section>
      <section id="view-bahan" class="view"></section>
      <section id="view-setting" class="view"></section>
    </main>
  </div>

</div>

<div id="sheet" class="sheet-backdrop">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <div class="sheet-tabs">
        <button class="active" data-stab="bahan">Dari Bahan</button>
        <button data-stab="manual">Input Manual</button>
      </div>
      <button class="sheet-close" id="sheet-close">✕</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<div id="toast"></div>

];

function defaultState(){
  return {target:1800, bahan:defaultBahan.slice(), log:{}};
}

var state = defaultState();

function setSyncStatus(s){
  var el = document.getElementById('sync-status');
  if(!el) return;
  el.textContent = s==='ok' ? 'tersinkron' : s==='syncing' ? 'sync...' : s==='error' ? 'gagal sync' : 'memuat...';
  el.className = s==='ok' ? 'ok' : s==='syncing' ? 'syncing' : s==='error' ? 'error' : '';
}

function loadLocal(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var s = JSON.parse(raw);
      if(s && s.bahan && s.log && typeof s.target === 'number') return s;
    }
  }catch(e){}
  return null;
}

async function loadFromCloud(){
  try{
    var res = await fetch(API_URL + '/api/load', { headers: { 'X-Secret': API_SECRET } });
    if(!res.ok) return null;
    var data = await res.json();
    if(data && data.bahan && data.log && typeof data.target === 'number') return data;
  }catch(e){}
  return null;
}

async function pushToCloud(){
  setSyncStatus('syncing');
  try{
    var res = await fetch(API_URL + '/api/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Secret': API_SECRET },
      body: JSON.stringify(state)
    });
    setSyncStatus(res.ok ? 'ok' : 'error');
  }catch(e){
    setSyncStatus('error');
  }
}

var saveTimer;
function save(){
  clearTimeout(saveTimer);
  state.lastModified = Date.now();
  saveTimer = setTimeout(function(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
    pushToCloud();
  }, 600);
}

function todayISO(){
  var d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function formatTanggal(iso){
  var d = new Date(iso+'T00:00:00');
  var hari = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  var bulan = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  return hari[d.getDay()]+', '+d.getDate()+' '+bulan[d.getMonth()]+' '+d.getFullYear();
}
function shiftDate(iso,delta){
  var d = new Date(iso+'T00:00:00');
  d.setDate(d.getDate()+delta);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

var currentDate = todayISO();
var currentView = 'hari';
var sheetSearchQuery = '';

function hitungItem(item){
  if(item.tipe==='manual'){
    return {kkal:item.kkal||0,protein:item.protein||0,karbo:item.karbo||0,lemak:item.lemak||0};
  }
  var b = null;
  for(var i=0;i<state.bahan.length;i++){ if(state.bahan[i].id===item.bahanId){ b=state.bahan[i]; break; } }
  if(!b) return {kkal:0,protein:0,karbo:0,lemak:0};
  var f = (item.gram||0)/100;
  return {kkal:b.kkal*f,protein:b.protein*f,karbo:b.karbo*f,lemak:b.lemak*f};
}
function namaItem(item){
  if(item.tipe==='manual') return item.nama||'(tanpa nama)';
  for(var i=0;i<state.bahan.length;i++){ if(state.bahan[i].id===item.bahanId) return state.bahan[i].nama; }
  return '(bahan dihapus)';
}
function totalHari(iso){
  var items = state.log[iso]||[];
  var t = {kkal:0,protein:0,karbo:0,lemak:0};
  items.forEach(function(i){
    var h = hitungItem(i);
    t.kkal+=h.kkal;t.protein+=h.protein;t.karbo+=h.karbo;t.lemak+=h.lemak;
  });
  return {kkal:round1(t.kkal),protein:round1(t.protein),karbo:round1(t.karbo),lemak:round1(t.lemak)};
}
function statusHero(sisa,target){
  if(sisa<0) return 'over';
  if(sisa<target*0.15) return 'warn';
  return 'ok';
}

function renderHari(){
  var el = document.getElementById('view-hari');
  var iso = currentDate;
  var items = state.log[iso]||[];
  var t = totalHari(iso);
  var target = state.target;
  var sisa = target - t.kkal;
  var pct = target>0 ? Math.min(100, t.kkal/target*100) : 0;
  var cls = statusHero(sisa,target);
  var isToday = iso===todayISO();

  var html = '';
  html += '<div class="hero '+cls+'">';
  html += '<div class="hero-label">'+(isToday?'Sisa hari ini':(sisa>=0?'Sisa di tanggal ini':'Kelebihan'))+'</div>';
  html += '<div class="hero-angka"><span>'+(sisa>=0?fmt(sisa):'-'+fmt(Math.abs(sisa)))+'</span><small>kkal</small></div>';
  html += '<div class="hero-bar"><div style="width:'+pct+'%;background:'+(cls==='over'?'var(--danger)':cls==='warn'?'var(--warn)':'var(--accent)')+'"></div></div>';
  html += '<div class="hero-stat">';
  html += '<div><small>Masuk</small><b>'+fmt(t.kkal)+'</b></div>';
  html += '<div><small>Target</small><b>'+fmt(target)+'</b></div>';
  html += '<div><small>Protein</small><b>'+fmt(t.protein)+'g</b></div>';
  html += '<div><small>Karbo</small><b>'+fmt(t.karbo)+'g</b></div>';
  html += '<div><small>Lemak</small><b>'+fmt(t.lemak)+'g</b></div>';
  html += '</div></div>';

  html += '<div class="section-title">Makanan ('+items.length+')</div>';
  html += '<div class="log-list">';
  if(items.length===0){
    html += '<div class="empty">Belum ada makanan. Klik tombol di bawah buat tambah.</div>';
  } else {
    items.forEach(function(it,idx){
      var h = hitungItem(it);
      var nm = namaItem(it);
      html += '<div class="log-item" data-idx="'+idx+'">';
      html += '<div class="li-info">';
      html += '<div class="li-nama">'+esc(nm)+'</div>';
      html += '<div class="li-makro"><b>'+fmt(h.kkal)+'</b> kkal &middot; '+fmt(h.protein)+'P &middot; '+fmt(h.karbo)+'K &middot; '+fmt(h.lemak)+'L</div>';
      html += '</div>';
      if(it.tipe==='bahan'){
        html += '<div class="li-gram-wrap"><input class="li-gram" type="number" inputmode="decimal" value="'+it.gram+'" data-act="gram"><small>g</small></div>';
      } else {
        html += '<div class="li-gram-wrap li-gram-empty">manual</div>';
      }
      html += '<button class="li-del" data-act="del">&#10005;</button>';
      html += '</div>';
    });
  }
  html += '</div>';
  html += '<button class="btn-add" id="btn-add">+ Tambah Makanan</button>';
  el.innerHTML = html;
}

function renderRiwayat(){
  var el = document.getElementById('view-riwayat');
  var today = todayISO();
  var dates = Object.keys(state.log).filter(function(d){ return state.log[d] && state.log[d].length>0; });
  if(dates.indexOf(today)===-1) dates.push(today);
  dates.sort().reverse();

  var html = '<div class="section-title">Riwayat ('+dates.length+' hari)</div>';
  html += '<div class="riwayat-list">';
  dates.forEach(function(d){
    var t = totalHari(d);

    var cls = statusHero(sisa,state.target);
    html += '<button class="riwayat-item" data-date="'+d+'">';
    html += '<div><div class="ri-nama">'+formatTanggal(d)+'</div>';
    html += '<div class="ri-sub">'+fmt(t.kkal)+' kkal masuk &middot; target '+fmt(state.target)+'</div></div>';
    html += '<div class="ri-sisa '+cls+'"><b>'+(sisa>=0?fmt(sisa):'-'+fmt(Math.abs(sisa)))+'</b><small>'+(sisa>=0?'sisa':'lebih')+'</small></div>';
    html += '</button>';
  });
  html += '</div>';
  el.innerHTML = html;
}

function openSheet(tab){
  document.getElementById('sheet').classList.add('open');
  var tabs = document.querySelectorAll('[data-stab]');
  for(var i=0;i<tabs.length;i++) tabs[i].classList.toggle('active', tabs[i].dataset.stab===tab);
  sheetSearchQuery = '';
  if(tab==='bahan') renderSheetBahan();
  else renderSheetManual();
}
function closeSheet(){
  document.getElementById('sheet').classList.remove('open');
}

function openSidebar(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebar-overlay').classList.add('open'); }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebar-overlay').classList.remove('open'); }
function toggleSidebar(){ document.getElementById('sidebar').classList.contains('open') ? closeSidebar() : openSidebar(); }

function switchView(view){
  currentView = view;
  var views = document.querySelectorAll('.view');
  for(var i=0;i<views.length;i++) views[i].classList.toggle('active', views[i].id==='view-'+view);
  var btns = document.querySelectorAll('.sidebar-nav button');
  for(var j=0;j<btns.length;j++) btns[j].classList.toggle('active', btns[j].dataset.view===view);
  if(view==='hari') renderHari();
  else if(view==='riwayat') renderRiwayat();
  else if(view==='bahan') renderBahan();
  else if(view==='setting') renderSetting();
  var m = document.getElementById('main-scroll');
  if(m) m.scrollTop = 0;
  closeSidebar();
}

function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(function(){ t.classList.remove('show'); },1800);
}

function tambahKeHari(item){
  if(!state.log[currentDate]) state.log[currentDate]=[];
  state.log[currentDate].push(item);
  save();
  if(currentView==='hari') renderHari();
}

document.addEventListener('click', function(e){
  var t = e.target;

  if(t.id==='menu-btn'){ toggleSidebar(); return; }
  if(t.id==='sidebar-overlay'){ closeSidebar(); return; }

  var nav = t.closest('.sidebar-nav button[data-view]');
  if(nav){ switchView(nav.dataset.view); return; }

  if(t.id==='prev-day'){
    currentDate = shiftDate(currentDate,-1);
    document.getElementById('date-picker').value = currentDate;
    renderHari(); return;
  }
  if(t.id==='next-day'){
    currentDate = shiftDate(currentDate,1);
    document.getElementById('date-picker').value = currentDate;
    renderHari(); return;
  }

  if(t.id==='btn-add'){ openSheet('bahan'); return; }
  if(t.id==='sheet-close' || t.id==='sheet'){ closeSheet(); return; }

  var stab = t.closest('[data-stab]');
  if(stab){
    var tabs = document.querySelectorAll('[data-stab]');
    for(var i=0;i<tabs.length;i++) tabs[i].classList.toggle('active', tabs[i]===stab);
    if(stab.dataset.stab==='bahan') renderSheetBahan();
    else renderSheetManual();
    return;
  }

  var pick = t.closest('[data-pick]');
  if(pick){
    var bahanId = pick.dataset.pick;
    tambahKeHari({id:uid(),tipe:'bahan',bahanId:bahanId,gram:100});
    closeSheet();
    toast('Ditambah 100g - edit gram di list');
    return;
  }

  if(t.id==='btn-save-manual'){
    var nama = document.getElementById('m-nama').value.trim();
    var kkal = num(document.getElementById('m-kkal').value);
    if(!nama){ alert('Isi nama makanan dulu'); return; }
    if(kkal<=0 && !confirm('Kalori 0, lanjut?')) return;
    tambahKeHari({
      id:uid(),tipe:'manual',nama:nama,
      kkal:kkal,
      protein:num(document.getElementById('m-protein').value),
      karbo:num(document.getElementById('m-karbo').value),
      lemak:num(document.getElementById('m-lemak').value)
    });
    closeSheet();
    toast('Ditambah: '+nama);
    return;
  }

  var delLog = t.closest('[data-act="del"]');
  if(delLog){
    var row = delLog.closest('.log-item');
    var idx = parseInt(row.dataset.idx);
    var items = state.log[currentDate]||[];
    items.splice(idx,1);
    save(); renderHari();
    return;
  }

  if(t.id==='btn-add-bahan'){
    var nb = {id:uid(),nama:'Bahan baru',kkal:0,protein:0,karbo:0,lemak:0};
    state.bahan.push(nb);
    save(); renderBahan();
    setTimeout(function(){
      var inp = document.querySelector('[data-id="'+nb.id+'"] .bahan-nama');
      if(inp){ inp.focus(); inp.select(); }
    },30);
    return;
  }

  var delBahan = t.closest('[data-act="del-bahan"]');
  if(delBahan){
    var item = delBahan.closest('.bahan-item');
    var id = item.dataset.id;
    var b = null;
    for(var k=0;k<state.bahan.length;k++){ if(state.bahan[k].id===id){ b=state.bahan[k]; break; } }
    var used = 0;
    Object.values(state.log).forEach(function(arr){ arr.forEach(function(i){ if(i.bahanId===id) used++; }); });
    var msg = used>0
      ? '"'+b.nama+'" dipakai di '+used+' catatan. Item itu jadi 0 kkal. Lanjut hapus?'
      : 'Hapus "'+b.nama+'"?';
    if(!confirm(msg)) return;
    state.bahan = state.bahan.filter(function(x){ return x.id!==id; });
    save(); renderBahan();
    return;
  }

  var riw = t.closest('[data-date]');
  if(riw){
    currentDate = riw.dataset.date;
    document.getElementById('date-picker').value = currentDate;
    switchView('hari');
    return;
  }

  if(t.id==='btn-save-target'){
    var v = num(document.getElementById('target-input').value);
    if(v<=0){ alert('Target harus lebih dari 0'); return; }
    state.target = v;
    save();
    toast('Target disimpen: '+fmt(v)+' kkal');
    return;
  }

  if(t.id==='btn-export'){
    var blob = new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'tracker-makan-'+todayISO()+'.json';
    a.click();
    URL.revokeObjectURL(a.href);
    toast('Backup diunduh');
    return;
  }

  if(t.id==='btn-import'){
    document.getElementById('file-import').click();
    return;
  }

  if(t.id==='btn-reset'){
    if(!confirm('Reset SEMUA data? Gak bisa dibatalin.')) return;
    state = defaultState();
    save();
    switchView('hari');
    toast('Data direset');
    return;
  }
});

document.addEventListener('input', function(e){
  var t = e.target;

  if(t.dataset.act==='gram'){
    var row = t.closest('.log-item');
    var idx = parseInt(row.dataset.idx);
    var items = state.log[currentDate]||[];
    if(items[idx]){
      items[idx].gram = num(t.value);
      save();
      var h = hitungItem(items[idx]);
      var info = row.querySelector('.li-makro');
      if(info) info.innerHTML = '<b>'+fmt(h.kkal)+'</b> kkal &middot; '+fmt(h.protein)+'P &middot; '+fmt(h.karbo)+'K &middot; '+fmt(h.lemak)+'L';
      updateHero();
    }
    return;
  }

  var bahanItem = t.closest('.bahan-item');
  if(bahanItem && t.dataset.field){
    var b = null;
    for(var i=0;i<state.bahan.length;i++){ if(state.bahan[i].id===bahanItem.dataset.id){ b=state.bahan[i]; break; } }
    if(!b) return;
    var f = t.dataset.field;
    if(f==='nama') b.nama = t.value;
    else b[f] = num(t.value);
    save();
    return;
  }

  if(t.id==='sheet-search'){
    sheetSearchQuery = t.value;
    renderPickList();
    return;
  }
});

document.addEventListener('change', function(e){
  if(e.target.id==='date-picker' && e.target.value){
    currentDate = e.target.value;
    renderHari();
    return;
  }
  if(e.target.id==='file-import'){
    var f = e.target.files[0];
    if(!f) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var s = JSON.parse(reader.result);
        if(!s.bahan||!s.log||typeof s.target!=='number') throw new Error('format');
        if(!confirm('Ganti semua data dengan backup ini?')) return;
        state = s;
        save();
        switchView('hari');
        toast('Data diimport');
      }catch(err){
        alert('File backup gak valid.');
      }
    };
    reader.readAsText(f);
    e.target.value = '';
  }
});

function updateHero(){
  var t = totalHari(currentDate);
  var target = state.target;
  var sisa = target - t.kkal;
  var pct = target>0 ? Math.min(100, t.kkal/target*100) : 0;
  var cls = statusHero(sisa,target);
  var hero = document.querySelector('.hero');
  if(!hero) return;
  hero.className = 'hero '+cls;
  hero.querySelector('.hero-angka span').textContent = sisa>=0?fmt(sisa):'-'+fmt(Math.abs(sisa));
  var bar = hero.querySelector('.hero-bar>div');
  bar.style.width = pct+'%';
  bar.style.background = cls==='over'?'var(--danger)':cls==='warn'?'var(--warn)':'var(--accent)';
  var stats = hero.querySelectorAll('.hero-stat b');
  if(stats.length>=5){
    stats[0].textContent = fmt(t.kkal);
    stats[1].textContent = fmt(target);
    stats[2].textContent = fmt(t.protein)+'g';
    stats[3].textContent = fmt(t.karbo)+'g';
    stats[4].textContent = fmt(t.lemak)+'g';
  }
}

async function initApp(){
  var local = loadLocal();
  var cloud = await loadFromCloud();

  if(cloud && local){
    state = (cloud.lastModified||0) >= (local.lastModified||0) ? cloud : local;
  } else if(cloud){
    state = cloud;
  } else if(local){
    state = local;
    pushToCloud();
  } else {
    state = defaultState();
    pushToCloud();
  }

  document.getElementById('date-picker').value = currentDate;
  renderHari();
  setSyncStatus(cloud ? 'ok' : 'syncing');
}

window.addEventListener('beforeunload', function(){
  if(saveTimer){
    clearTimeout(saveTimer);
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  }
});

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('/service-worker.js').catch(function(){});
  });
}

initApp();

})();
</script>
</body>
</html>
