<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>Smart Assistant</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0e1116;--card:#171d26;--line:#2b3543;--text:#e6edf3;--muted:#8b98a8;--accent:#3ddc97}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:20px;
}
.box{
  max-width:440px;text-align:center;
  background:var(--card);border:1px solid var(--line);
  border-radius:18px;padding:36px 24px;
}
.box .ic{font-size:52px;margin-bottom:14px}
.box h1{font-size:20px;font-weight:700;margin-bottom:8px}
.box p{color:var(--muted);font-size:13.5px;margin-bottom:22px}
.box a{
  display:inline-block;
  background:var(--accent);color:#08130d;
  padding:11px 22px;border-radius:10px;
  font-weight:700;text-decoration:none;font-size:14px;
}
</style>
</head>
<body>
<div class="box">
  <div class="ic">🧠</div>
  <h1>Smart Assistant</h1>
  <p>Modul ini belum dibangun. Gua bakal kerjain setelah Tracker Gym kelar.</p>
  <a href="/">← Balik ke Home</a>
</div>
</body>
</html>
